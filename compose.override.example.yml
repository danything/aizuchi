# cp compose.override.example.yml compose.override.yml して埋める。
# compose.override.yml は .gitignore 済みで、docker compose が compose.yml に自動で重ねる。
services:
  aizuchi:
    environment:
      # --- slack ---
      SLACK_BOT_TOKEN: xoxb-...
      SLACK_APP_TOKEN: xapp-...
      # 自分を呼んで始まったスレッドの続きに、メンション無しでも返す。既定は on
      #SLACK_THREAD_FOLLOWUP: "off"
      # --- claude ---
      ANTHROPIC_API_KEY: sk-ant-...
      #CLAUDE_MODEL: claude-opus-5
      #CLAUDE_MAX_TOKENS: "16000"
      #CLAUDE_EFFORT: high
      #CLAUDE_FALLBACKS: default
      # Web 検索(サーバーツール)。1 応答あたりの上限。0 / 未設定で無効
      #CLAUDE_WEB_SEARCH_MAX_USES: "8"
      # --- github (任意。App なら ID と秘密鍵、PAT なら GITHUB_TOKEN + GITHUB_OWNERS) ---
      #GITHUB_APP_ID: "123456"
      #GITHUB_APP_PRIVATE_KEY: |
      #  -----BEGIN RSA PRIVATE KEY-----
      #  ...
      #  -----END RSA PRIVATE KEY-----
      #GITHUB_OWNERS: danything,5ym
      # --- openproject (任意。セルフホストの URL と API キー) ---
      #OPENPROJECT_URL: https://openproject.example.com
      #OPENPROJECT_API_KEY: ...
      # --- anarlog (任意。投稿先チャンネル ID。署名鍵は Slack の DM から登録する) ---
      #ANARLOG_SLACK_CHANNEL: C0XXXXXXX
      #ANARLOG_STORE_DIR: /data/anarlog
      #ANARLOG_PUBLIC_URL: https://hook.example.com/webhooks/anarlog
      # --- bot 共通 ---
      #BOT_SYSTEM_PROMPT: 常に関西弁で。
      #BOT_MAX_HISTORY: "50"
      #BOT_UPDATE_INTERVAL_MS: "1500"
