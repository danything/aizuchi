name: Release (image + chart)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # チャートは OCI で同じ ghcr に置く。バージョンは 0.1.<run_number> で単調増加、
      # appVersion = コミット SHA(イメージの既定タグになる)
      - name: Package and push chart
        run: |
          helm package charts/aizuchi \
            --version "0.1.${{ github.run_number }}" \
            --app-version "${{ github.sha }}"
          helm push "aizuchi-0.1.${{ github.run_number }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
        env:
          HELM_REGISTRY_CONFIG: /home/runner/.docker/config.json
