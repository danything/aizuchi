# ローカル開発用。danything/genkan(caddy-docker-proxy)を先に起動しておくと
# https://aizuchi.localhost/readyz で状態が見える。ポートは公開しない(genkan の流儀)。
# トークンや API キーは compose.override.yml(git 管理外)に書く。雛形は compose.override.example.yml
services:
  aizuchi:
    build: .
    restart: unless-stopped
    environment:
      CHAT_CONNECTOR: slack
      LLM_PROVIDER: claude
    labels:
      caddy: aizuchi.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    networks: [default, proxy]

networks:
  proxy:
    external: true
