# https://api.slack.com/apps → Create New App → From a manifest に貼る
display_information:
  name: Claude
  description: Claude と Slack のスレッドで会話する
  background_color: "#1f1f1f"
features:
  bot_user:
    display_name: Claude
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # @メンション
      - chat:write          # 返信と途中経過の更新
      - im:history          # DM の本文と履歴
      - channels:history    # 公開チャンネルのスレッド追従と履歴
      - groups:history      # 非公開チャンネル
      - mpim:history        # グループ DM
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
