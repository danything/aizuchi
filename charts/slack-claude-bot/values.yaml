image:
  repository: ghcr.io/danything/slack-claude-bot
  # 省略時は Chart の appVersion(= ビルドしたコミット SHA)
  tag: ""

# 3 つのキーを持つ Secret:
#   slack-bot-token    xoxb-...(Bot User OAuth Token)
#   slack-app-token    xapp-...(App-Level Token, connections:write)
#   anthropic-api-key  sk-ant-...(Claude Console の API キー)
existingSecret: slack-claude-bot

# Secret を External Secrets Operator で Infisical から引く場合。
# 無効なら existingSecret を別の手段で用意すること。
externalSecret:
  enabled: false
  storeName: infisical
  storeKind: ClusterSecretStore
  # Infisical 側のフォルダ。中のシークレット名がそのまま Secret のキーになる
  path: ""            # 例: /slack-claude-bot/slack-claude-bot
  refreshInterval: 1h

claude:
  model: claude-opus-5
  maxTokens: 16000
  # low / medium / high / xhigh / max。空なら API 既定(high)
  effort: ""
  # 拒絶時にサーバー側で別モデルへフォールバックする beta。"off" で無効
  fallbacks: default
  # 既定のシステムプロンプトに追記する文
  systemPrompt: ""

bot:
  # スレッド/DM から Claude に渡す直近メッセージ数
  maxHistory: 50

# そのまま container.env に足す
extraEnv: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
