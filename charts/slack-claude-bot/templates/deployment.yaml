apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  # Socket Mode は 1 接続で足りる。入れ替え中に 2 台が同じイベントを取り合わないよう Recreate
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: slack-bot-token
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: slack-app-token
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: anthropic-api-key
            - name: CLAUDE_MODEL
              value: {{ .Values.claude.model | quote }}
            - name: CLAUDE_MAX_TOKENS
              value: {{ .Values.claude.maxTokens | quote }}
            {{- with .Values.claude.effort }}
            - name: CLAUDE_EFFORT
              value: {{ . | quote }}
            {{- end }}
            - name: CLAUDE_FALLBACKS
              value: {{ .Values.claude.fallbacks | quote }}
            {{- with .Values.claude.systemPrompt }}
            - name: CLAUDE_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            - name: BOT_MAX_HISTORY
              value: {{ .Values.bot.maxHistory | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /readyz は Socket Mode が hello を受け取るまで 503
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
