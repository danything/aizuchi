image:
  repository: ghcr.io/danything/aizuchi
  # 省略時は Chart の appVersion(= ビルドしたコミット SHA)
  tag: ""

# どのチャットに繋ぐか / どの LLM で答えるか
connector: slack
provider: claude

# Slack コネクタの設定(connector: slack のとき)
slack:
  # @aizuchi を呼んで始まったスレッドでは、続きにメンション無しでも返すか。
  # 人同士のスレッドに途中から呼ばれた場合は、これが true でも呼ばれたときしか返さない。
  # false にすると DM 以外はいつでもメンションが要る
  threadFollowUp: true

# 認証情報を持つ Secret。キーはコネクタ / プロバイダごとに決まっている:
#   slack:  slack-bot-token(xoxb-) / slack-app-token(xapp-, connections:write)
#   claude: anthropic-api-key(sk-ant-)
existingSecret: aizuchi

# Secret を External Secrets Operator で Infisical から引く場合。
# 無効なら existingSecret を別の手段で用意すること。
externalSecret:
  enabled: false
  storeName: infisical
  storeKind: ClusterSecretStore
  # Infisical 側のフォルダ。中のシークレット名がそのまま Secret のキーになる
  path: ""            # 例: /aizuchi/aizuchi
  refreshInterval: 1h

bot:
  # 既定のシステムプロンプトに追記する文
  systemPrompt: ""
  # LLM に渡す直近メッセージ数
  maxHistory: 50
  # 1 スコープ(共有 / チャンネル)あたりの記憶の上限文字数
  memoryMaxChars: 8000
  # スレッド返信のとき参考に渡す、チャンネル直近のメッセージ数。0 で無効
  channelContext: 20

# 記憶(memory)の置き場。無効にすると「覚えて」が効かなくなる
persistence:
  enabled: true
  size: 1Gi
  # 空なら既定の StorageClass
  storageClass: ""

claude:
  model: claude-opus-5
  maxTokens: 16000
  # low / medium / high / xhigh / max。空なら API 既定(high)
  effort: ""
  # 拒絶時にサーバー側で別モデルへフォールバックする beta。"off" で無効
  fallbacks: default

# GitHub を読む道具(読み取り専用)。auth は app か token
github:
  enabled: false
  auth: app
  # auth: app のとき。秘密鍵は existingSecret のキー github-app-private-key(PEM 全文)
  appId: ""
  # auth: token のとき。PAT は existingSecret のキー github-token。読ませる owner は必須
  # auth: app では省略可(インストール先が全部読める)。絞るなら書く
  owners: ""      # 例: danything,5ym

# そのまま container.env に足す
extraEnv: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
