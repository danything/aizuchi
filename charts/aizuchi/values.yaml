image:
  repository: ghcr.io/danything/aizuchi
  # 省略時は Chart の appVersion(= ビルドしたコミット SHA)
  tag: ""

# どのチャットに繋ぐか / どの LLM で答えるか
connector: slack
provider: claude

# 認証情報を持つ Secret。キーはコネクタ / プロバイダごとに決まっている:
#   slack:  slack-bot-token(xoxb-) / slack-app-token(xapp-, connections:write)
#   claude: anthropic-api-key(sk-ant-)
existingSecret: aizuchi

# Secret を External Secrets Operator で Infisical から引く場合。
# 無効なら existingSecret を別の手段で用意すること。
externalSecret:
  enabled: false
  storeName: infisical
  storeKind: ClusterSecretStore
  # Infisical 側のフォルダ。中のシークレット名がそのまま Secret のキーになる
  path: ""            # 例: /aizuchi/aizuchi
  refreshInterval: 1h

bot:
  # 既定のシステムプロンプトに追記する文
  systemPrompt: ""
  # LLM に渡す直近メッセージ数
  maxHistory: 50

claude:
  model: claude-opus-5
  maxTokens: 16000
  # low / medium / high / xhigh / max。空なら API 既定(high)
  effort: ""
  # 拒絶時にサーバー側で別モデルへフォールバックする beta。"off" で無効
  fallbacks: default

# そのまま container.env に足す
extraEnv: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
