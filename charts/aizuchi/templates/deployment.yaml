apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  # Socket Mode は 1 接続で足りる。入れ替え中に 2 台が同じイベントを取り合わないよう Recreate
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: aizuchi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          env:
            - name: CHAT_CONNECTOR
              value: {{ .Values.connector | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.provider | quote }}
            {{- if eq .Values.connector "slack" }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: slack-bot-token
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: slack-app-token
            - name: SLACK_THREAD_FOLLOWUP
              value: {{ if .Values.slack.threadFollowUp }}"on"{{ else }}"off"{{ end }}
            {{- end }}
            {{- if eq .Values.provider "claude" }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: anthropic-api-key
            - name: CLAUDE_MODEL
              value: {{ .Values.claude.model | quote }}
            - name: CLAUDE_MAX_TOKENS
              value: {{ .Values.claude.maxTokens | quote }}
            {{- with .Values.claude.effort }}
            - name: CLAUDE_EFFORT
              value: {{ . | quote }}
            {{- end }}
            - name: CLAUDE_FALLBACKS
              value: {{ .Values.claude.fallbacks | quote }}
            {{- end }}
            {{- if .Values.github.enabled }}
            {{- if eq .Values.github.auth "token" }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-token
            {{- else }}
            - name: GITHUB_APP_ID
              value: {{ required "github.appId が必要です" .Values.github.appId | quote }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-private-key
            {{- end }}
            {{- with .Values.github.owners }}
            - name: GITHUB_OWNERS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.bot.systemPrompt }}
            - name: BOT_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            - name: BOT_MAX_HISTORY
              value: {{ .Values.bot.maxHistory | quote }}
            - name: BOT_MEMORY_DIR
              value: {{ if .Values.persistence.enabled }}"/data/memory"{{ else }}"off"{{ end }}
            - name: BOT_MEMORY_MAX_CHARS
              value: {{ .Values.bot.memoryMaxChars | quote }}
            - name: BOT_CHANNEL_CONTEXT
              value: {{ .Values.bot.channelContext | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /readyz はコネクタが接続を確立するまで 503
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
      # イメージは非 root(app)で動く。PVC の root は provisioner 次第で root 所有なので、
      # fsGroup で書けるようにする
      securityContext:
        fsGroup: 1654
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- end }}
