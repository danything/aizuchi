{{- if .Values.webhooks.enabled }}
# webhook 受信のときだけ外に出す。出すのは /webhooks/ 配下だけで、/healthz /readyz は出さない
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-webhooks
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ required "webhooks.host が必要です" .Values.webhooks.host }}`) && PathPrefix(`/webhooks/`)
      services:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
